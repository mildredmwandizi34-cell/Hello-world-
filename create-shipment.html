<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Shipment | American Global Logistics</title>

<link rel="stylesheet" href="style.css">

<style>

@media print {

    body{
        margin:0;
        padding:0;
        background:#fff;
    }

    nav,
    .navbar,
    form,
    button:not(.print-btn),
    .header p,
    footer{
        display:none !important;
    }

    #receipt{
        display:block !important;
        page-break-inside:avoid;
        break-inside:avoid;
    }

    #receipt *{
        page-break-inside:avoid;
        break-inside:avoid;
    }

    table{
        page-break-inside:avoid;
    }
}

  @media print {
    body * {
        visibility: hidden;
    }

    #receipt, #receipt * {
        visibility: visible;
    }

    #receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }
}
    
</style>

</head>

<body>

<header class="header">

<img src="image/file_00000000fb107243823fd30bcb45f00f.png"
alt="AGL Logo"
class="logo">

<h1>Create a Shipment</h1>

<p>Fast • Secure • Reliable Worldwide Shipping</p>

</header>

<nav class="navbar">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="create-shipment.html" class="active">Create Shipment</a>
<a href="track.html">Track Shipment</a>
<a href="contact.html">Contact</a>
<a href="receipt.html">Receipt</a>
</nav>

<section class="section">

<div class="container create-container">

<h2 class="section-title">Shipment Information</h2>

<div class="card">

<form id="shipmentForm">

<h2 class="section-title">Sender Information</h2>

<div class="card">

<h3>Personal Details</h3>

<input
type="text"
id="senderName"
placeholder="Full Name"
required>

<input
type="text"
id="senderCompany"
placeholder="Company Name (Optional)">

<textarea
id="senderAddress"
placeholder="Full Address"
rows="3"
required>

<input
type="text"
id="senderCity"
placeholder="City"
required>

<input
type="text"
id="senderCountry"
placeholder="Country"
required>

<input
type="tel"
id="senderPhone"
placeholder="Phone Number"
required>

<input
type="email"
id="senderEmail"
placeholder="Email Address"
required>

</div>

<h2 class="section-title">Receiver Information</h2>

<div class="card">

<h3>Personal Details</h3>

<input
type="text"
id="receiverName"
placeholder="Full Name"
required>

<input
type="text"
id="receiverCompany"
placeholder="Company Name (Optional)">

<textarea
id="receiverAddress"
placeholder="Full Address"
rows="3"
required>

<input
type="text"
id="receiverCity"
placeholder="City"
required>

<input
type="text"
id="receiverCountry"
placeholder="Country"
required>

<input
type="tel"
id="receiverPhone"
placeholder="Phone Number"
required>

<input
type="email"
id="receiverEmail"
placeholder="Email Address"
required>

</div>

<h2 class="section-title">Shipment Details</h2>

<div class="card">

<h3>Shipment Information</h3>

<input
type="text"
id="package"
placeholder="Package Description"
required>

<input
type="number"
id="weight"
placeholder="Weight (kg)"
required>

<input
type="text"
id="dimensions"
placeholder="Dimensions (L × W × H)">

<input
type="number"
id="declaredValue"
placeholder="Declared Value (USD)">

<select
id="service">

<option value="">Select Shipping Service</option>
<option>Air Freight</option>
<option>Ocean Freight</option>
<option>Road Transport</option>
<option>Express Delivery</option>

</select>

<select
id="paymentStatus">

<option value="">Payment Status</option>
<option>Paid</option>
<option>Pending</option>
<option>Cash on Delivery</option>

</select>

<select
id="insurance">

<option value="">Insurance</option>
<option>Yes</option>
<option>No</option>

</select>

<input
type="text"
id="origin"
placeholder="Origin"
required>

<input
type="text"
id="destination"
placeholder="Destination"
required>

<input
type="date"
id="deliveryDate">

<textarea
id="instructions"
placeholder="Special Instructions"
rows="4">

</div>

    <h2 class="section-title">Package Identification</h2>

<div class="card">

<h3>Package Information</h3>

<input
type="text"
id="referenceNumber"
placeholder="Reference Number (Optional)">

<input
type="text"
id="customerReference"
placeholder="Customer Reference"
style="width:100%;padding:15px;margin-bottom:15px;">

<select
id="packageType">

<option value="">Package Type</option>

<option>Documents</option>

<option>Parcel</option>

<option>Electronics</option>

<option>Medical Supplies</option>

<option>Fragile Goods</option>

<option>Industrial Equipment</option>

<option>Personal Effects</option>

</select>

<input
type="number"
id="pieces"
placeholder="Number of Pieces">

<input
type="text"
id="trackingBarcode"
placeholder="Barcode Number (Optional)">

</div>

<h2 class="section-title">Shipment Charges & Authorization</h2>

<div class="card">

<h3>Billing Information</h3>

<input
type="number"
id="shippingCost"
placeholder="Shipping Cost (USD)">

<input
type="number"
id="tax"
placeholder="Tax / VAT (USD)">

<input
type="number"
id="discount"
placeholder="Discount (USD)">

<input
type="number"
id="totalAmount"
placeholder="Total Amount (USD)">

<hr style="margin:25px 0;">

<h3>Authorization</h3>

<input
type="text"
id="senderSignature"
placeholder="Sender Name (for signature)">

<input
type="text"
id="authorizedOfficer"
placeholder="AGL Authorized Officer">

</div>
    
<button
type="submit"
style="
background:#0b4ea2;
color:white;
padding:15px 25px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
margin-top:20px;
width:100%;
">
Create Shipment
</button>

</form>
    
<div id="receipt" style="display:none; margin-top:30px;">

<div style="
max-width:700px;
margin:auto;
background:#fff;
border:2px solid #0b4ea2;
border-radius:12px;
padding:30px;
box-shadow:0 6px 20px rgba(0,0,0,.15);
">

<div style="text-align:center;">

<img
src="image/file_00000000fb107243823fd30bcb45f00f.png"
style="width:90px;">

<h2 style="color:#0b4ea2;margin:10px 0;">
American Global Logistics
</h2>

<p style="margin:0;font-size:18px;font-weight:bold;">
OFFICIAL SHIPMENT RECEIPT
</p>

<hr>

</div>

<div id="receiptContent"></div>

<div style="text-align:center;margin-top:25px;">

<button
onclick="window.print()"
style="
background:#0b4ea2;
color:white;
padding:12px 25px;
border:none;
border-radius:6px;
cursor:pointer;
">

🖨 Print Receipt

</button>

</div>

</div>

 </div>

</section>

<footer>   

<p><strong>American Global Logistics</strong></p>

<p>Creating Reliable Shipments Worldwide</p>

<p style="margin-top:15px;">
© 2026 American Global Logistics. All Rights Reserved.
</p>

</footer>
 
<script src="create-shipment.js"></script>
</body>
</html>
