<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | American Global Logistics</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<header class="dashboard-header">

    <div class="logo-area">

        <img src="image/agl-logo.png" class="logo" alt="AGL Logo">

        <div>

            <h1>American Global Logistics</h1>
            <p>Shipment Management Dashboard</p>

        </div>

    </div>

    <div class="header-right">

        <button id="logoutBtn">Logout</button>

    </div>

</header>

<main class="dashboard">

    <!-- Statistics -->
    <<section class="stats">

    <div class="card">
        <h3>Total Shipments</h3>
        <h1 id="totalShipments">0</h1>
        <small>All Shipments</small>
    </div>

    <div class="card">
        <h3>Awaiting</h3>
        <h1 id="awaiting">0</h1>
        <small>Pending Pickup</small>
    </div>

    <div class="card">
        <h3>In Transit</h3>
        <h1 id="inTransit">0</h1>
        <small>Currently Moving</small>
    </div>

    <div class="card">
        <h3>Delivered</h3>
        <h1 id="delivered">0</h1>
        <small>Completed</small>
    </div>

    </section>

    <!-- Search -->
    <section class="search-box">

        <input
            type="text"
            id="searchShipment"
            placeholder="Search by tracking number, sender or receiver">

    </section>

    <!-- Shipment Table -->
    <section class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Tracking</th>
                    <th>Sender</th>
                    <th>Receiver</th>
                    <th>Status</th>
                    <th>Location</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="shipmentTable">

            </tbody>

        </table>

    </section>

</main>

<!-- Edit Shipment -->
<section id="editPanel" class="edit-panel">

<h2>Edit Shipment</h2>

<input id="editTracking" placeholder="Tracking Number" readonly>

<input id="editStatus" placeholder="Shipment Status">

<input id="editLocation" placeholder="Current Location">

<input type="date" id="editDelivery">

<textarea
id="editInstructions"
placeholder="Special Instructions"></textarea>

<div class="button-group">

<button id="saveShipment">
Save Changes
</button>

<button id="viewReceipt">
Open Receipt
</button>

<button id="deleteShipment">
Delete Shipment
</button>

</div>

</section>

<script src="js/admin.js"></script>

</body>

    </html>
